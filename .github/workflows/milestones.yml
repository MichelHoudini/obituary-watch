name: ObituaryWatch — Milestone Notifier

on:
  schedule:
    # Runs Mon, Wed, Fri at 10:00 UTC
    - cron: '0 10 * * 1,3,5'
  workflow_dispatch:  # Allow manual trigger

jobs:
  milestones:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install requests psycopg2-binary sentry-sdk

      - name: Run milestone notifier
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: python -m app.milestones
