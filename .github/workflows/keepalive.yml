name: ObituaryWatch — Keepalive Ping

on:
  schedule:
    # Render's free tier spins down the web service after ~15 minutes of
    # inactivity, then takes 50+ seconds to wake back up on the next
    # request. If Googlebot (or a real visitor) hits the site during that
    # cold-start window, it can see a 5xx error -- which is exactly what
    # happened: Search Console reported "Erro no servidor (5xx)" for
    # mortivox.com on 2026-08-19.
    #
    # Pinging every 10 minutes keeps the instance warm well within that
    # 15-minute window, so it never spins down in the first place. This
    # costs nothing extra: the repo is public, so GitHub Actions minutes
    # are unlimited, and each ping takes a few seconds.
    #
    # In practice, GitHub does not run scheduled workflows on the exact
    # interval requested -- observed gaps between runs of this workflow
    # have ranged from ~18 to ~65 minutes under GitHub's own scheduling
    # load, a known platform limitation, not something fixable from this
    # config. That means the instance can still spin down between pings
    # sometimes. The job below is built to tolerate that: rather than
    # trying to force tighter scheduling (outside our control), it just
    # needs to succeed at waking the instance back up when it finds it
    # asleep, instead of giving up early.
    #
    # --max-time applies fresh to each retry attempt, not shared across
    # them (verified locally against a deliberately slow test server) --
    # so 90s per attempt comfortably covers Render's own stated "50
    # seconds or more" wake time, and --retry 1 is a safety net for a
    # rarer, separate hiccup (e.g. a connection dropped mid-wake), not a
    # way to cover a repeatedly-slow wake-up. Worst case (90s + 5s delay
    # + 90s) is ~185s, well inside the job's own 5-minute timeout below.
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Ping /status to keep the instance warm
        run: |
          curl -sS -o /dev/null -w "status=%{http_code} time=%{time_total}s\n" \
            --max-time 90 \
            --retry 1 --retry-delay 5 --retry-connrefused \
            https://mortivox.com/status
