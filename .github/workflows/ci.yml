name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: mortivox
          POSTGRES_PASSWORD: mortivox
          POSTGRES_DB: mortivox_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mortivox"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://mortivox:mortivox@localhost:5432/mortivox_test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Initialize DB and run migrations
        run: |
          python - <<'EOF'
          from app.db import init_db, migrate_schema
          init_db()
          migrate_schema()
          print("DB ready")
          EOF

      - name: Ruff (lint)
        run: python -m ruff check app tests

      - name: mypy (type check)
        run: python -m mypy app

      - name: Vulture (dead code)
        run: python -m vulture app

      - name: pytest (unit tests)
        run: python -m pytest tests --ignore=tests/e2e -v -rs

  ingestor-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ingestor deps only (mirrors ingestor.yml — catches missing deps)
        run: pip install requests mwparserfromhell psycopg2-binary sentry-sdk sseclient-py httpx

      - name: Ingestor dry-run with offline fixtures
        run: |
          python - <<'EOF'
          from app.db import init_db, migrate_schema
          import app.ingestion as ing
          import app.filters as flt

          # Init + migrate so all columns exist before _run_candidates queries them.
          init_db()
          migrate_schema()

          flt._OFFLINE_MODE = True
          flt._FIXTURE_ENTITIES = {
              "Smoke_Test_Person": {"occupation_qids": ["Q177220"], "location_qids": []}
          }
          ing._OFFLINE_MODE = True
          ing._FIXTURE_DEATHS = [{
              "qid": "Q99999",
              "wiki_title": "Smoke_Test_Person",
              "display_name": "Smoke Test Person",
              "death_date_raw": "2024-01-01T00:00:00Z",
              "categories": ["Category:Dead people"],
              "wikitext": "{{Infobox person|death_date={{Death date|2024|1|1}}}}",
          }]

          result = ing.run(days_back=1, dry_run=True)
          print(f"ingestor dry-run: {result}")
          assert result["errors"] == 0, f"unexpected errors: {result}"
          EOF

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Install Playwright browser
        run: python -m playwright install --with-deps chromium

      - name: pytest (e2e, real browser)
        run: python -m pytest tests/e2e -v
