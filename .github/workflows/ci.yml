name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: mortivox
          POSTGRES_PASSWORD: mortivox
          POSTGRES_DB: mortivox_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://mortivox:mortivox@localhost:5432/mortivox_test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Initialize DB and run migrations
        run: |
          python - <<'EOF'
          from app.db import init_db, migrate_schema
          init_db()
          migrate_schema()
          print("DB ready")
          EOF

      - name: Ruff (lint)
        run: python -m ruff check app tests

      - name: mypy (type check)
        run: python -m mypy app

      - name: Vulture (dead code)
        run: python -m vulture app

      - name: pytest (unit tests)
        run: python -m pytest tests --ignore=tests/e2e -v

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Install Playwright browser
        run: python -m playwright install --with-deps chromium

      - name: pytest (e2e, real browser)
        run: python -m pytest tests/e2e -v
