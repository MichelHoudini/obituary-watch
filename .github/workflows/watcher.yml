name: ObituaryWatch — Wikipedia Watcher

on:
  schedule:
    # Runs every 2 hours (was hourly). Halves Actions minute consumption on
    # this private repo -- 24 runs/day at ~44min avg was ~1000+ min/day,
    # blowing through the 2000 min/month free tier limit in a few days.
    # Each run still uses close to the full window once started, so when
    # it's live it's fully live; the tradeoff is a longer gap (up to ~72min
    # instead of ~16min) between runs where a death could go undetected a
    # bit longer, not a shorter/lower-quality stream connection.
    - cron: '0 */2 * * *'
  workflow_dispatch:  # Allow manual trigger from GitHub UI

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 50  # Stop before next hour starts

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install requests sseclient-py mwparserfromhell psycopg2-binary httpx sentry-sdk

      - name: Run watcher for 50 minutes
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: timeout 2900 python -m app.watcher || true
